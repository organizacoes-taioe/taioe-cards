# Confere as cópias que o app carrega: o supabase-js e o módulo de sessão, iguais aos do README
# do taioe-hub (contrato da origem, item 6), e o motor, igual ao js/motor.js das ferramentas.
# Ao atualizar o supabase-js ou a sessão, mude os valores aqui e nos outros dois repositórios.
name: Cópias

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: sha256 das cópias
        run: |
          echo "59d39487c3589843b410322d8a3d562ce022aba1e5ccb16898ef3fb2a0da2ecd  public/cards/vendor/supabase-js-2.117.2.js" > "$RUNNER_TEMP/esperado.txt"
          echo "a1f94e2ca73a7ee9aa5f8ec3a8dba939b1adaafe441d149896aa7bb2013942ca  public/cards/js/taioe-sessao.js" >> "$RUNNER_TEMP/esperado.txt"
          sha256sum -c "$RUNNER_TEMP/esperado.txt"
      - name: O motor do app é o das ferramentas
        run: cmp js/motor.js public/cards/js/motor.js
      - name: A interface nas três línguas (mesmas chaves, nada fora do dicionário)
        run: node fonte/conferir-i18n.js
      - name: O build está em dia (baralhos, catálogo, carimbos)
        run: |
          node fonte/build.js
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: "O começo do app: transparência, presumidos, nivelamento"
        run: node fonte/testar-comeco.js
      - name: "Os textos da Biblioteca: card de leitura, escolha, versos"
        run: node fonte/testar-textos.js
      - name: "O latim: funil estrito, gabaritos, fases só de ida, conceitos, trechos"
        run: node fonte/testar-latim.js
      - name: "A pergunta lida como espanhol: o aviso dispara, também com artigo"
        run: node fonte/testar-leitura.js
