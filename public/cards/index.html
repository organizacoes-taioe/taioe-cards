<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12141c">
<title>Taioé Cards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇪🇸</text></svg>">
<link rel="stylesheet" href="style.css?v=ce53eb2d">
</head>
<body>

<header class="topo">
  <a class="marca" href="/" title="Taioé" data-i18n-attr="title:topo.marca">Taioé</a>
  <div class="placar" id="placar"></div>
  <!-- as línguas em estudo, com dois ou mais cursos começados (24/10/2026) -->
  <nav class="cursos-topo" id="cursos-topo" hidden data-i18n-attr="aria-label:topo.cursos"></nav>
  <!-- guarda o que se digita enquanto a tela sobe para o card novo (24/10/2026; ver segurarTeclas) -->
  <input id="captura" class="captura" type="text" tabindex="-1" aria-hidden="true"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <!-- Ícones de traço, herdando a cor da paleta: emoji trazem cor própria e
       brigavam com o verde-noite. O de «todos os cards» é a própria pilha.
       Desde 21/10/2026 os destinos ficam num menu (ideia do Gere): o ícone
       sozinho obrigava a adivinhar, e no menu cada um tem o seu nome. -->
  <nav class="acoes-topo">
    <button class="icone" id="btn-menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu-topo"
            data-i18n-attr="title:topo.menu;aria-label:topo.menu">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.5 7h15"/><path d="M4.5 12h15"/><path d="M4.5 17h15"/>
      </svg>
    </button>
    <div class="menu-topo" id="menu-topo" role="menu" hidden>
      <button class="item-menu" id="btn-inicio" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.6 10.7 12 4.2l8.4 6.5"/>
          <path d="M6.2 9.6V19.8h11.6V9.6"/>
          <path d="M10 19.8v-4.6h4v4.6"/>
        </svg>
        <span data-i18n="topo.inicio"></span>
      </button>
      <button class="item-menu" id="btn-painel" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.6 17.6h16.8"/>
          <path d="M7.4 17.6v-5.6"/>
          <path d="M12 17.6V6.4"/>
          <path d="M16.6 17.6v-8.2"/>
        </svg>
        <span data-i18n="topo.painel"></span>
      </button>
      <button class="item-menu" id="btn-cards" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8.2" y="3.4" width="12.4" height="12.4" rx="2.4"/>
          <path d="M15.8 20.6H5.8a2.4 2.4 0 0 1-2.4-2.4V8.2"/>
        </svg>
        <span data-i18n="topo.cards"></span>
      </button>
      <button class="item-menu" id="btn-texto" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 6.4C9.8 4.9 6.9 4.6 4 5v13c2.9-.4 5.8-.1 8 1.4"/>
          <path d="M12 6.4c2.2-1.5 5.1-1.8 8-1.4v13c-2.9-.4-5.8-.1-8 1.4"/>
          <path d="M12 6.4v13"/>
        </svg>
        <span data-i18n="topo.textos"></span>
      </button>
      <button class="item-menu" id="btn-config" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7.2h16"/><path d="M4 12h16"/><path d="M4 16.8h16"/>
          <circle cx="9.2" cy="7.2" r="2.3"/>
          <circle cx="15" cy="12" r="2.3"/>
          <circle cx="8.2" cy="16.8" r="2.3"/>
        </svg>
        <span data-i18n="topo.config"></span>
      </button>
    </div>
  </nav>
</header>

<main>

  <!-- ══════════ PORTA: enquanto a conta e o curso abrem ══════════ -->
  <section id="tela-porta" class="tela">
    <div class="bloco-inicio">
      <p class="sub" id="porta-texto" data-i18n="porta.abrindoConta"></p>
      <button class="primario oculto" id="porta-entrar" data-i18n="porta.entrarDeNovo"></button>
      <noscript><p class="sub" lang="pt-BR">Os Cards precisam de JavaScript.</p><p class="sub" lang="es">Taioé Cards necesita JavaScript.</p><p class="sub" lang="en">Taioé Cards needs JavaScript.</p></noscript>
    </div>
  </section>

  <!-- ══════════ ESCOLHA DO CURSO (na primeira vez, e ao trocar de língua) ══════════ -->
  <section id="tela-escolha" class="tela oculto">
    <div class="bloco-inicio">
      <h1 data-i18n="escolha.titulo"></h1>
      <p class="sub" data-i18n="escolha.apoio"></p>
      <div class="escolha-curso" id="escolha-cursos"></div>
      <p class="sub oculto" id="escolha-nenhum" data-i18n="escolha.nenhum"></p>
      <p class="linha-manter"><button class="secundario oculto" id="btn-escolha-manter"></button></p>
      <label class="seletor-lingua"><span data-i18n="escolha.lingua"></span>
        <select id="escolha-lingua">
          <option value="pt" lang="pt-BR">Português</option>
          <option value="es" lang="es">Español</option>
          <option value="en" lang="en">English</option>
        </select>
      </label>
    </div>
  </section>

  <!-- ══════════ INÍCIO ══════════ -->
  <section id="tela-inicio" class="tela oculto">
    <div class="bloco-inicio">
      <h1 data-i18n="inicio.titulo"></h1>
      <p class="sub" id="resumo-inicio"></p>
      <button class="primario grande" id="btn-comecar" data-i18n="inicio.proximo"></button>
    </div>
  </section>

  <!-- ══════════ O COMEÇO: a avaliação, o resultado e «como funciona» (PLANO.md, 7) ══════════
       Uma tela só; o app desenha cada passo dentro dela (comeco-conteudo). -->
  <section id="tela-comeco" class="tela oculto">
    <div id="comeco-conteudo" class="comeco"></div>
  </section>

  <!-- ══════════ CARD ══════════ -->
  <section id="tela-card" class="tela oculto">
    <div class="fichario">
    <div class="card">
      <span class="aba" id="aba-nivel"></span>
      <div class="card-meta">
        <span class="etiqueta" id="meta-tipo"></span>
        <span class="etiqueta suave" id="meta-modo"></span>
        <!-- só nas frases presas a uma palavra: diz qual foi -->
        <span class="etiqueta origem oculto" id="meta-origem"></span>
        <!-- o card desafio (PLANO.md, 7.4): a marca é para o erro não pesar -->
        <span class="etiqueta desafio oculto" id="meta-desafio" data-i18n="card.desafio"></span>
        <!-- o teste de um presumido (15/11/2026): a palavra que a estimativa dá como sabida -->
        <span class="etiqueta desafio oculto" id="meta-teste" data-i18n="card.teste"></span>
      </div>
      <p id="aviso-teste" class="aviso-teste oculto" role="status" data-i18n="card.avisoTeste"></p>

      <!-- Este bloco gruda ao rolar: ver .pergunta-fixa no style.css -->
      <div class="pergunta-fixa">
        <p class="enunciado" id="enunciado"></p>
        <div class="termo-linha">
          <span class="bandeira" id="bandeira-pergunta" data-i18n-attr="title:card.bandeiraPergunta">🇪🇸</span>
          <div class="termo" id="termo"></div>
        </div>
      </div>

      <p class="rotulo-resposta">
        <span class="bandeira" id="bandeira-resposta" data-i18n-attr="title:card.bandeiraResposta">🇧🇷</span>
        <span id="rotulo-resposta-txt"></span>
      </p>

      <!-- múltipla escolha -->
      <div id="area-multipla" class="alternativas"></div>
      <!-- não saber também é resposta, e conta como erro sem chute -->
      <div id="area-nao-sei-multipla" class="linha-botoes oculto">
        <button class="secundario" id="btn-nao-sei-multipla" data-i18n="card.naoSei"></button>
      </div>

      <!-- escrita -->
      <div id="area-escrita" class="oculto">
        <!-- respondeu em espanhol, ou com o sinônimo: avisa e devolve a vez, sem contar erro. Fica
             acima da caixa, onde se vê (o Gere, 07/11/2026: embaixo, «nem vejo») -->
        <p id="aviso-lingua" class="aviso-lingua oculto" role="status"></p>
        <textarea id="entrada" rows="1" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" maxlength="120"
               placeholder=""></textarea>
        <div class="linha-botoes">
          <button class="primario" id="btn-responder" data-i18n="card.responder"></button>
          <button class="secundario" id="btn-nao-sei" data-i18n="card.naoSei"></button>
        </div>
      </div>

      <!-- «já conheço»: só na estreia do card, depois de acertar de primeira; o app o põe logo acima
           do «Próximo» (posicionarJaConheco, em app.js) -->
      <p class="linha-ja-conheco oculto">
        <button class="ja-conheco" id="btn-arquivar"></button>
      </p>

      <!-- feedback -->
      <div id="area-feedback" class="oculto">
        <div class="veredito" id="veredito"></div>
        <div class="conquista oculto" id="conquista"></div>
        <!-- a prévia do desafio (frase ainda presa): entra no jogo, ou volta depois -->
        <p id="aviso-previa" class="aviso-previa oculto" role="status"></p>
        <!-- acertou sem o acento: conta como certo, e a linha chama atenção -->
        <p id="aviso-acento" class="aviso-acento oculto"></p>
        <!-- acertou com a palavra de outro lugar: vale, e diz de onde ela é -->
        <p id="aviso-regiao" class="aviso-regiao oculto"></p>
        <div class="resposta-dada oculto" id="resposta-dada">
          <span class="rotulo" data-i18n="card.voceEscreveu"></span>
          <strong id="texto-dado"></strong>
        </div>
        <div class="resposta-certa" id="caixa-resposta">
          <span class="rotulo"><span id="bandeira-feedback">🇧🇷</span> <span data-i18n="card.resposta"></span></span>
          <strong id="resposta-certa"></strong>
        </div>

        <div id="area-julgamento" class="julgamento oculto">
          <p class="pergunta-julgamento" data-i18n="card.julgamento"></p>
          <div class="linha-botoes">
            <button class="opcao-julgamento acertei" data-julgamento="certo" data-i18n="card.acertei"></button>
            <button class="opcao-julgamento errei" data-julgamento="errado" data-i18n="card.errei"></button>
          </div>
        </div>
        <p class="nota" id="nota"></p>
        <div class="medidas" id="medidas"></div>


        <div id="area-contestar" class="contestar oculto">
          <button class="link-contestar" id="btn-contestar" data-i18n="card.contestar"></button>
          <p class="aviso-contestado oculto" id="aviso-contestado" data-i18n="card.contestado"></p>
        </div>

        <!-- vale para qualquer card, tendo acertado ou não -->
        <p class="linha-comentar">
          <button class="link-comentar" id="btn-comentar-card" data-i18n="card.comentar"></button>
        </p>

        <button class="primario grande" id="btn-proximo" data-i18n="inicio.proximo"></button>
      </div>
    </div>
    </div>
  </section>

  <!-- ══════════ TODOS OS CARDS ══════════ -->
  <section id="tela-cards" class="tela oculto">
    <h2 data-i18n="cards.titulo"></h2>

    <div class="filtros">
      <input type="search" id="busca-cards" autocomplete="off"
             placeholder="">
      <div class="linha-filtros">
        <label class="filtro"><span data-i18n="cards.tipo"></span>
          <select id="filtro-tipo">
            <option value="" data-i18n="cards.todos"></option>
            <option value="palavra" data-i18n="cards.palavras"></option>
            <option value="frase" data-i18n="cards.frases"></option>
            <option value="conceito" data-i18n="cards.conceitos" hidden></option>
            <option value="forma" data-i18n="cards.formas" hidden></option>
            <option value="contraste" data-i18n="cards.contrastes" hidden></option>
          </select>
        </label>
        <label class="filtro"><span data-i18n="cards.nivel"></span>
          <select id="filtro-nivel"><option value="" data-i18n="cards.todos"></option></select>
        </label>
        <label class="filtro"><span data-i18n="cards.tema"></span>
          <select id="filtro-tag"><option value="" data-i18n="cards.todos"></option></select>
        </label>
        <label class="filtro"><span data-i18n="cards.situacao"></span>
          <select id="filtro-estado">
            <option value="" data-i18n="cards.todas"></option>
            <option value="novo" data-i18n="cards.fNovo"></option>
            <option value="preso" data-i18n="cards.fPreso"></option>
            <option value="andamento" data-i18n="cards.fAndamento"></option>
            <option value="invertido"></option>
            <option value="dominado" data-i18n="cards.fDominado"></option>
            <option value="errei" data-i18n="cards.fErrei"></option>
            <option value="arquivado" data-i18n="cards.fArquivado"></option>
            <option value="transparente" data-i18n="cards.fTransparente"></option>
            <option value="presumido" data-i18n="cards.fPresumido"></option>
          </select>
        </label>
      </div>
      <p class="contagem" id="contagem-cards"></p>
    </div>

    <div id="lista-cards" class="lista-cards"></div>
    <button class="secundario" data-voltar data-i18n="comum.voltar"></button>
  </section>

  <!-- ══════════ PAINEL ══════════ -->
  <section id="tela-painel" class="tela oculto">
    <h2 data-i18n="painel.titulo"></h2>
    <div id="painel-conteudo"></div>
    <div id="dica" class="dica" role="status" hidden></div>
    <button class="secundario" data-voltar data-i18n="comum.voltar"></button>
  </section>

  <!-- ══════════ TEXTOS (TRILHAS) ══════════ -->
  <section id="tela-texto" class="tela oculto">
    <h2 data-i18n="texto.titulo"></h2>
    <div id="texto-conteudo"></div>
    <button class="secundario" data-voltar data-i18n="comum.voltar"></button>
  </section>

  <!-- ══════════ CONFIGURAÇÕES ══════════ -->
  <section id="tela-config" class="tela oculto">
    <h2 data-i18n="config.titulo"></h2>

    <div class="grupo">
      <h3 data-i18n="config.conta"></h3>
      <p class="ajuda" id="cfg-conta"></p>
      <p class="estado-sync" id="estado-sync"></p>
      <div class="linha-botoes">
        <button class="secundario" id="btn-conta" data-i18n="config.minhaConta"></button>
        <button class="secundario" id="btn-sair" data-i18n="config.sair"></button>
      </div>
    </div>

    <div class="grupo">
      <h3 data-i18n="config.curso"></h3>
      <p class="ajuda" id="cfg-curso"></p>
      <div class="linha-botoes" id="cfg-outros-cursos"></div>
    </div>

    <div class="grupo">
      <h3 data-i18n="config.comeco"></h3>
      <p class="ajuda" data-i18n="config.comecoAjuda"></p>
      <div class="linha-botoes">
        <button class="secundario" id="btn-refazer" data-i18n="config.refazer"></button>
      </div>
    </div>

    <div class="grupo">
      <h3 id="cfg-lingua-titulo" data-i18n="config.lingua"></h3>
      <p class="ajuda" data-i18n="config.linguaAjuda"></p>
      <select id="cfg-lingua" class="seletor-lingua" aria-labelledby="cfg-lingua-titulo">
        <option value="pt" lang="pt-BR">Português</option>
        <option value="es" lang="es">Español</option>
        <option value="en" lang="en">English</option>
      </select>
    </div>

    <div class="grupo">
      <h3 data-i18n="config.copia"></h3>
      <p class="ajuda" data-i18n="config.copiaAjuda"></p>
      <button class="secundario" id="btn-exportar" data-i18n="config.exportar"></button>
    </div>

    <div class="grupo">
      <h3 data-i18n="config.comentarios"></h3>
      <p class="ajuda" data-i18n="config.comentariosAjuda"></p>
      <div id="cfg-comentarios" class="meus-comentarios"></div>
    </div>

    <div class="grupo perigo">
      <h3 data-i18n="config.recomecarTitulo"></h3>
      <p class="ajuda" data-i18n="config.recomecarAjuda"></p>
      <button class="secundario" id="btn-recomecar" data-i18n="config.recomecar"></button>
    </div>

    <div class="grupo perigo">
      <h3 data-i18n="config.aparelho"></h3>
      <p class="ajuda" data-i18n="config.aparelhoAjuda"></p>
      <button class="secundario" id="btn-zerar" data-i18n="config.zerar"></button>
    </div>

    <button class="secundario" data-voltar data-i18n="comum.voltar"></button>
  </section>

</main>

<!-- Comentar qualquer card, de dentro do card ou da lista. Um painel só,
     que as duas portas de entrada abrem apontando para um id. -->
<div class="comentario-fundo oculto" id="comentario-fundo">
  <div class="comentario-painel" role="dialog" aria-modal="true" aria-labelledby="comentario-titulo">
    <h3 id="comentario-titulo" data-i18n="comentario.titulo"></h3>
    <p class="comentario-alvo" id="comentario-alvo"></p>
    <textarea id="comentario-texto" rows="4" maxlength="500"
              data-i18n-attr="placeholder:comentario.placeholder"></textarea>
    <p class="comentario-conta"><span id="comentario-restam">500</span> <span data-i18n="comentario.restantes"></span></p>
    <div class="linha-botoes">
      <button class="primario" id="btn-comentario-enviar" data-i18n="comentario.enviar"></button>
      <button class="secundario" id="btn-comentario-fechar" data-i18n="comentario.cancelar"></button>
    </div>
  </div>
</div>

<!-- «Recomeçar este curso»: diz quanto vai ser apagado e só libera o botão
     depois que a pessoa digita a frase, como os sites fazem nas exclusões. -->
<div class="comentario-fundo oculto" id="recomecar-fundo">
  <div class="comentario-painel" role="dialog" aria-modal="true" aria-labelledby="recomecar-titulo">
    <h3 id="recomecar-titulo"></h3>
    <p class="recomecar-texto" id="recomecar-vistos"></p>
    <p class="recomecar-texto" data-i18n="config.recomecarApaga"></p>
    <label class="recomecar-texto" for="recomecar-frase" id="recomecar-pede"></label>
    <input type="text" id="recomecar-frase" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="linha-botoes">
      <button class="primario perigo" id="btn-recomecar-sim" data-i18n="config.recomecarSim" disabled></button>
      <button class="secundario" id="btn-recomecar-nao" data-i18n="comentario.cancelar"></button>
    </div>
  </div>
</div>

<!-- «Já conheço»: a pergunta fica na própria página (03/11/2026). A janela do
     navegador (confirm) deixava a página sem foco ao fechar, e no celular o
     teclado do card seguinte não escrevia em caixa nenhuma. -->
<div class="comentario-fundo oculto" id="arquivar-fundo">
  <div class="comentario-painel" role="dialog" aria-modal="true" aria-labelledby="arquivar-titulo">
    <h3 id="arquivar-titulo"></h3>
    <p class="recomecar-texto" id="arquivar-texto"></p>
    <div class="linha-botoes">
      <button class="primario" id="btn-arquivar-sim" data-i18n="arquivar.sim"></button>
      <button class="secundario" id="btn-arquivar-nao" data-i18n="comentario.cancelar"></button>
    </div>
  </div>
</div>

<footer class="rodape">
  <span id="rodape-sync">•</span>
</footer>

<script src="js/textos-i18n.js?v=f9b126d4"></script>
<script src="js/i18n.js?v=a99747e0"></script>
<script src="vendor/supabase-js-2.117.2.js?v=16aeff36"></script>
<script src="js/taioe-sessao.js?v=4c9cdaf3"></script>
<script src="js/versoes.js?v=6a40d28e"></script>
<script src="data/tags.js?v=8be697dd"></script>
<script src="js/motor.js?v=5185d08b"></script>
<script src="js/armazem.js?v=131120d0"></script>
<script src="js/sincronia.js?v=e9949e1c"></script>
<script src="js/app.js?v=ef95c87b"></script>
<script src="js/inicio.js?v=2f5391b6"></script>
</body>
</html>
